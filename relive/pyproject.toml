[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relive"
version = "1.0.0"
description = "ReliVE-v1: reliable visual evidence verification research framework"
requires-python = ">=3.11"
dependencies = ["Pillow>=9.2", "PyYAML>=6"]

[project.scripts]
relive = "relive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relive = ["prompts/*.txt"]
